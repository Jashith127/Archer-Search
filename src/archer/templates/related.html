<section class="related" {% if not v.related %}data-related-q="{{ v.q }}" hidden{% endif %} data-related-tab="{{ v.tab }}">
  <h2 class="section-title">Related searches</h2>
  <div class="chips">
    {% for term in v.related %}
    <a class="chip" href="/search?q={{ term|qs }}{% if v.tab != 'all' %}&tab={{ v.tab }}{% endif %}">{{ term }}</a>
    {% endfor %}
  </div>
</section>
{% if personal and personal.related %}
<section class="related related--mine">
  <h2 class="section-title"><svg aria-hidden="true"><use href="#u-clock"/></svg>Your earlier searches like this</h2>
  <div class="chips">
    {% for item in personal.related %}
    <a class="chip chip--history" href="/search?q={{ item.q|qs }}{% if v.tab != 'all' %}&tab={{ v.tab }}{% endif %}" title="Searched {{ item.last|ago }}">{{ item.q }}<span class="chip-note">{{ item.last|ago }}</span></a>
    {% endfor %}
  </div>
</section>
{% endif %}
