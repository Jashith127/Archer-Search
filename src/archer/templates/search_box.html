{% macro search_box(q='', tab='all', home=false) %}
<div class="searchbox{% if home %} searchbox--home{% endif %}" data-searchbox data-suggest-min="{{ suggest_min }}" data-suggest-max="{{ suggest_max_length }}">
  <form class="searchbar{% if home %} searchbar--home{% endif %}" action="/search" method="get" role="search">
    <svg class="searchbar-lead" aria-hidden="true"><use href="#i-search"/></svg>
    <input name="q" value="{{ q }}" {% if home %}autofocus placeholder="Search the web privately"{% endif %} autocomplete="off" spellcheck="false" aria-label="Search">
    {% if tab != 'all' %}<input type="hidden" name="tab" value="{{ tab }}">{% endif %}
    <button type="button" class="searchbar-clear" aria-label="Clear search"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
    <button type="submit" class="searchbar-go"><svg aria-hidden="true"><use href="#i-search"/></svg>Search</button>
  </form>
</div>
{% endmacro %}
