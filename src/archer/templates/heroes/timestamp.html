{% from "macros.html" import hero_badge %}
{% set t = v.hero.data %}
<section class="hero hero-time">
  <div>
    {{ hero_badge("clock", "Unix timestamp") }}
    <p class="clock clock--sm">{{ t.epoch }}</p>
  </div>
  <dl class="kv-grid">
    <div><dt>UTC</dt><dd>{{ t.utc }}</dd></div>
    <div><dt>Your time</dt><dd>{{ t.local }}</dd></div>
  </dl>
</section>
